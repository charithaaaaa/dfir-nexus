<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DFIR Nexus Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #101827; --bg-2: #172338; --bg-3: #1b2a40; --bg-hl: #293a56;
    --fg: #e3e9f3; --fg-dim: #a4b1c5; --border: #2c3c52; --accent: #a78bfa;
    --confirmed: #5bc6a5; --likely: #e5b66d; --suspected: #df8297; --ok: #5bc6a5;
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font:16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { position:sticky; top:0; z-index:2; display:flex; gap:12px; align-items:center;
           min-height:64px; padding:10px clamp(14px,3vw,30px); background:var(--bg-2); border-bottom:1px solid var(--border); }
  header .title { font-weight:650; letter-spacing:.01em; white-space:nowrap; }
  header .case { color:var(--accent); background:rgba(167,139,250,.08); padding:5px 9px;
                 border-radius:7px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
  header select, header button { background:var(--bg-3); color:var(--fg); border:1px solid var(--border);
                                 border-radius:8px; padding:7px 10px; font:inherit; }
  header .spacer { flex: 1; }
  header a { color:var(--accent); text-decoration:none; padding:7px 10px; border-radius:8px; }
  header a:hover { background:rgba(167,139,250,.1); }
  header .meta { color:var(--fg-dim); font-size:12px; font-variant-numeric:tabular-nums; }
  main { width:min(1120px,calc(100% - 48px)); margin:0 auto; padding:38px 0 96px; }
  .empty { color:var(--fg-dim); padding:52px 20px; text-align:center; background:var(--bg-2); border:1px solid var(--border); border-radius:14px; }
  article { min-width:0; overflow-wrap:anywhere; }
  article h1 { margin:0 0 28px; font-size:clamp(28px,3vw,36px); line-height:1.25; letter-spacing:-.025em; border-bottom:1px solid var(--border); padding-bottom:18px; }
  article h2 { font-size:22px; line-height:1.35; margin:48px 0 18px; border-bottom:1px solid var(--border); padding-bottom:11px; scroll-margin-top:84px; }
  article h3 { font-size:17px; line-height:1.45; margin:32px 0 10px; color:var(--fg); scroll-margin-top:84px; }
  article p { max-width:88ch; color:var(--fg); margin:16px 0 20px; }
  article li { max-width:92ch; padding:3px 0; color:var(--fg); }
  article a { color:#c7b7ff; overflow-wrap:anywhere; }
  article a.cid { text-decoration:none; border-bottom:1px dotted var(--accent);
                  font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.92em; }
  article a.cid:hover { background:rgba(167,139,250,.12); }
  article code { background:var(--bg-3); padding:2px 5px; border-radius:5px;
                 font:0.88em/1.55 ui-monospace, Menlo, Consolas, monospace;
                 overflow-wrap:anywhere; word-break:break-word; }
  article pre { max-width:100%; background:var(--bg-2); border:1px solid var(--border); padding:16px;
                overflow:auto; border-radius:10px; font-size:12px; line-height:1.7; }
  article pre code { background:none; padding:0; }
  article blockquote { margin:24px 0; padding:12px 18px; border-left:3px solid var(--accent); color:var(--fg-dim); background:rgba(167,139,250,.06); border-radius:0 8px 8px 0; }
  article hr { height:0; margin:44px 0; border:0; border-top:1px solid var(--border); }
  article .table-wrap {
    width:100%; max-width:100%; margin:24px 0 30px; overflow-x:auto; overflow-y:hidden;
    overscroll-behavior-x:contain; border:1px solid var(--border); border-radius:10px;
    background:var(--bg-2);
  }
  article table {
    width:100%; min-width:max(100%, var(--table-min-width, 0px));
    border-collapse:separate; border-spacing:0; table-layout:auto; font-size:14px;
  }
  article th, article td {
    min-width:0; padding:12px 15px; border-bottom:1px solid var(--border);
    text-align:left; vertical-align:top; line-height:1.6;
    overflow-wrap:anywhere; word-break:normal;
  }
  article th {
    position:static; top:auto; background:var(--bg-3); color:var(--fg);
    font-weight:650; white-space:normal;
  }
  article td code { display:inline; }
  article tbody tr:last-child td { border-bottom:0; }
  article tr:nth-child(even) td { background:rgba(27,42,64,.48); }
  article .tier-CONFIRMED { color:var(--confirmed); font-weight:650; }
  article .tier-LIKELY { color:var(--likely); font-weight:650; }
  article .tier-SUSPECTED { color:var(--suspected); font-weight:650; }
  nav.toc { position:fixed; top:86px; right:max(20px,calc((100vw - 1300px)/2)); width:220px;
            max-height:calc(100vh - 108px); overflow-y:auto; font-size:12px;
            background:var(--bg-2); border:1px solid var(--border); border-radius:12px; padding:12px; }
  nav.toc::before { content:"On this page"; display:block; margin-bottom:8px; color:var(--fg); font-weight:650; }
  nav.toc a { display:block; color:var(--fg-dim); text-decoration:none; padding:4px 5px; border-radius:5px; }
  nav.toc a.h3 { padding-left:14px; }
  nav.toc a:hover { color:var(--accent); background:rgba(167,139,250,.08); }
  @media (max-width:1450px) { nav.toc { display:none; } }
  @media (max-width:700px) {
    header { flex-wrap:wrap; gap:7px; }
    header .title { flex:1 1 50%; }
    header .meta { order:4; flex:1 1 100%; }
    header .spacer { display:none; }
    main { width:calc(100% - 28px); padding-top:24px; }
    article h1 { font-size:25px; }
    article h2 { font-size:19px; margin-top:38px; }
    article th, article td { padding:10px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<header>
  <span class="title">DFIR Nexus report</span>
  <span class="case" id="case"></span>
  <select id="picker" title="Reports in this case's reports/ folder"></select>
  <button id="reload" title="Reload the report">↻</button>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <a id="trace-link" target="trudi-trace" title="Open the trace view">Trace ↗</a>
</header>
<main><article id="doc"><div class="empty">Loading…</div></article></main>
<nav class="toc" id="toc"></nav>
<script>
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const trace = params.get('trace') || '';
const api = (ep, q) => `/_dashboard/api/${ep}?` + new URLSearchParams(q).toString();
const traceHref = (cid) => `dashboard.html?trace=${encodeURIComponent(trace)}` + (cid ? `&call=${cid}` : '');

function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60); }

function decorate(root) {
  // Give each table enough width for readable columns; the wrapper scrolls on
  // narrow screens rather than compressing the cells or the document.
  root.querySelectorAll('table').forEach(t => {
    const columns = Math.max(0, ...Array.from(t.rows, row => row.cells.length));
    t.style.setProperty('--table-min-width', `${columns * 160}px`);
    const w = document.createElement('div'); w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  // tier words stand out, as in the trace view
  root.querySelectorAll('td, h3').forEach(el => {
    if (el.children.length) return;
    const m = el.textContent.match(/\b(CONFIRMED|LIKELY|SUSPECTED)\b/);
    if (m && el.textContent.trim().length < 40) el.classList.add('tier-' + m[1]);
  });
  // call references open the trace view at that call
  root.querySelectorAll('a.cid').forEach(a => {
    a.href = traceHref(a.dataset.cid); a.target = 'trudi-trace';
    a.title = `open call #${a.dataset.cid} in the trace view`;
  });
  // table of contents
  const toc = $('#toc'); toc.innerHTML = '';
  root.querySelectorAll('h2, h3').forEach(h => {
    if (!h.id) h.id = slug(h.textContent);
    const a = document.createElement('a');
    a.href = '#' + h.id; a.textContent = h.textContent; a.className = h.tagName.toLowerCase();
    toc.appendChild(a);
  });
}

async function show(name) {
  const doc = $('#doc');
  if (!name) { doc.innerHTML = '<div class="empty">No report in this case\'s reports/ folder yet.</div>'; return; }
  const resp = await fetch(api('report', {trace, name}), {cache: 'no-store'});
  if (!resp.ok) { doc.innerHTML = `<div class="empty">Could not load ${name}: ${resp.status} ${resp.statusText}</div>`; return; }
  doc.innerHTML = await resp.text();      // server-rendered; raw HTML in the Markdown is not rendered
  decorate(doc);
  const url = new URL(location.href); url.searchParams.set('name', name); history.replaceState(null, '', url);
}

async function init() {
  $('#trace-link').href = traceHref();
  if (!trace) { $('#doc').innerHTML = '<div class="empty">Open this page from the trace view (it needs ?trace=…).</div>'; return; }
  const resp = await fetch(api('reports', {trace}), {cache: 'no-store'});
  const data = resp.ok ? await resp.json() : {reports: [], error: resp.statusText};
  $('#case').textContent = data.case || '';
  const pick = $('#picker');
  pick.innerHTML = (data.reports || []).map(r =>
    `<option value="${r.name}">${r.name}</option>`).join('');
  const want = params.get('name');
  const first = (data.reports || []).find(r => r.name === want) || (data.reports || [])[0];
  if (first) {
    pick.value = first.name;
    $('#meta').textContent = `${(first.bytes / 1024).toFixed(0)} KB · ${new Date(first.mtime * 1000).toISOString().slice(0, 16).replace('T', ' ')} UTC`;
  }
  pick.onchange = () => show(pick.value);
  $('#reload').onclick = () => init();
  show(first && first.name);
}
init();
</script>
</body>
</html>
